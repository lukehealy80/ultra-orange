<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>webport</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background-color: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
        }

        #loading-text {
            color: #ffffff;
            font-family: sans-serif;
            font-size: 32px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <div id="loading-text">LOADING...</div>
        <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    </div>

    <script src="Build/9853637125e801e9aae48e78dbbdcfca.loader.js"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loadingText = document.querySelector("#loading-text");

        // Mobile Viewport Handling
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index])
                        .then((response) => {
                            if (!response.ok) throw new Error(`Failed to load chunk: ${fileParts[index]}`);
                            return response.arrayBuffer();
                        })
                        .then((data) => {
                            buffers.push(data);
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        // Load split data and run Unity instance
        mergeFiles(getParts("Build/2facc552a7176a3c4f6184e293ead869.data.unityweb", 1, 3))
            .then((dataUrl) => {
                canvas.hidden = false;
                return createUnityInstance(canvas, {
                    dataUrl: dataUrl,
                    frameworkUrl: "Build/372c51523da4553ad9ad6740d46ef615.framework.js.unityweb",
                    codeUrl: "Build/4316a55f7504875581587d5c75896d34.wasm.unityweb",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Hakita",
                    productName: "ULTRA",
                    productVersion: "1.0",
                }).then((unityInstance) => {
                    loadingText.remove();
                    URL.revokeObjectURL(dataUrl); // Release memory after load
                });
            })
            .catch((err) => {
                loadingText.innerText = "Error loading game. Check console for details.";
                console.error("Unity WebGL Load Error:", err);
            });
    </script>
</body>

</html>
